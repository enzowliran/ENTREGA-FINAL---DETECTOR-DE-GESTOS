<script type="module">
import * as THREE from "three";
import { criarMao, atualizarMao } from "/demo/mao_modelo.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const statusEl = document.getElementById("status");
const depthEl = document.getElementById("depth");
const fovEl = document.getElementById("fovv");
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");

// Fonte das imagens: a webcam (sozinha) ou o servidor do projeto (na apresentação). Ver "de onde vêm as imagens".
const PARAMS = new URLSearchParams(location.search);
// Modo de três telas (?tres=1, usado na apresentação): câmera crua | mesmo quadro com os 21 pontos | mão em 3D.
const TRES = PARAMS.has("tres");
let c1 = null, c2 = null, cena3 = null;
if (TRES) {
  document.body.classList.add("tres");
  const grade = document.createElement("div");
  grade.id = "tresGrade";
  grade.innerHTML = '<figure><div class="tela"><canvas class="quadroTres" id="c1"></canvas></div><figcaption>1 · Câmera<span>a imagem como chega</span></figcaption></figure>'
    + '<figure><div class="tela"><canvas class="quadroTres" id="c2"></canvas></div><figcaption>2 · Pontos do MediaPipe<span>21 pontos por mão</span></figcaption></figure>'
    + '<figure><div class="tela"><div id="cena3"></div></div><figcaption>3 · Modelo 3D<span>os pontos montados em 3D</span></figcaption></figure>';
  document.body.appendChild(grade);
  c1 = document.getElementById("c1"); c2 = document.getElementById("c2"); cena3 = document.getElementById("cena3");
}
function tamanhoCena() { return TRES ? [cena3.clientWidth || 400, cena3.clientHeight || 600] : [innerWidth, innerHeight]; }
const EMBUTIDO = PARAMS.has("embutido");
// Miniatura (?mini=1, no canto dos slides): só a mão 3D, com zoom automático para ela ocupar o quadro.
const MINI = PARAMS.has("mini");
if (MINI) document.body.classList.add("mini");
let fovMini = 40;   // campo de visão da miniatura (zoom automático)
const DO_SERVIDOR = EMBUTIDO || PARAMS.has("servidor");
const stream = document.getElementById("stream");
const quadroCanvas = document.createElement("canvas"), qctx = quadroCanvas.getContext("2d");
function tamanhoFonte() {
  return DO_SERVIDOR ? [stream.naturalWidth || 0, stream.naturalHeight || 0] : [video.videoWidth || 0, video.videoHeight || 0];
}

// Campo de visão horizontal estimado da webcam (graus). Ajustável com [ e ].
let HFOV = 62;
fovEl.textContent = HFOV;

// ---------- cena 3D (unidades em metros; câmera virtual = webcam) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(...tamanhoCena());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
(TRES ? cena3 : document.getElementById("scene")).appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
function resetView() {
  camera.position.set(0, 0, TRES ? 0.3 : 0.001);   // no lugar da webcam (no modo três, um pouco atrás, para caber na coluna)
  controls.target.set(0, 0, -0.5);
  controls.update();
}
function updateCameraFov() {
  const [vw, vh] = tamanhoFonte();
  const aspect = vw && vh ? vh / vw : 9 / 16;
  camera.fov = MINI ? fovMini : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(HFOV) / 2) * aspect));
  const [cw, ch] = tamanhoCena();
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
}
resetView(); updateCameraFov();

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(0.4, 1.2, 0.3);
sun.target.position.set(0, -0.3, -0.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -0.6, right: 0.6, top: 0.6, bottom: -0.6, near: 0.1, far: 3 });
sun.shadow.radius = 6;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xfff4ea, 0x202830, 0.6));

const FLOOR_Y = -0.32;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, FLOOR_Y, -0.6); floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(2, 40, 0x3a4652, 0x222a32);
grid.position.set(0, FLOOR_Y + 0.001, -0.6);
scene.add(grid);

addEventListener("resize", () => { renderer.setSize(...tamanhoCena()); updateCameraFov(); });
addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") resetView();
  if (e.key === "v" || e.key === "V") alternarVisual();
  if (e.key === "[" || e.key === "]") {
    HFOV = THREE.MathUtils.clamp(HFOV + (e.key === "]" ? 2 : -2), 30, 110);
    fovEl.textContent = HFOV; updateCameraFov();
  }
});

// ---------- geometria da mão ----------
// Raio aproximado (m) de cada uma das 21 juntas de uma mão adulta.
const R = [0.017,
  0.0125, 0.0110, 0.0098, 0.0088,     // polegar
  0.0098, 0.0090, 0.0082, 0.0074,     // indicador
  0.0100, 0.0092, 0.0083, 0.0075,     // médio
  0.0095, 0.0086, 0.0078, 0.0071,     // anelar
  0.0088, 0.0077, 0.0070, 0.0064];    // mínimo
const FINGER_BONES = [[1,2],[2,3],[3,4],[5,6],[6,7],[7,8],[9,10],[10,11],[11,12],[13,14],[14,15],[15,16],[17,18],[18,19],[19,20]];
const PALM_EDGE = [[0,1],[0,17],[5,9],[9,13],[13,17],[2,5]];
const ALL_BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                   [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const OUTLINE = [0, 1, 2, 5, 9, 13, 17];   // contorno da palma
const PALM_HALF = 0.0115;                  // meia espessura da palma (m)

const sphereGeo = new THREE.SphereGeometry(1, 24, 16);
const UP = new THREE.Vector3(0, 1, 0);

// ---------- mão realista (padrão; a tecla V alterna com o desenho antigo de esferas e cilindros) ----------
// Um modelo de mão com malha e ossos, movido pelos 21 pontos do MediaPipe: ver demo/mao_modelo.js.
// Aqui fica só o que depende da página: qual visual está ligado e de que lado está a palma.
const MaoReal = ((ESPELHO, ROTULO_FIXO) => {
  const a1 = new THREE.Vector3(), a2 = new THREE.Vector3(), a3 = new THREE.Vector3(), nP = new THREE.Vector3();
  let visual = "realista";
  try { if (localStorage.getItem("maoVisual") === "antigo") visual = "antigo"; } catch (e) {}
  { const q = new URLSearchParams(location.search).get("visual"); if (q === "antigo" || q === "realista") visual = q; }
  const todas = [];

  function criar(cor, pai) {
    const r = criarMao(cor, pai);
    r.grupo.visible = visual === "realista"; todas.push(r);
    return r;
  }

  // De que lado do produto vetorial (5-0) x (17-0) fica a palma. Vem do rótulo Left/Right do MediaPipe (que depende de a
  // imagem estar espelhada ou não: ESPELHO) e, quando os dedos estão dobrados, da direção em que eles dobram (sempre para
  // a palma). Se a dobra discordar do rótulo várias vezes seguidas, a convenção se corrige sozinha.
  let votoEspelho = 0;
  function ladoDaPalma(h, p, nc) {
    let e = 0;
    for (const [m, t] of [[5, 8], [9, 12], [13, 16], [17, 20]]) e += a3.subVectors(p[t], p[m]).dot(nc);
    const doRotulo = h.rotulo === "Left" ? ESPELHO : h.rotulo === "Right" ? -ESPELHO : 0;
    if (Math.abs(e) > 0.06) {
      const curva = Math.sign(e);
      if (doRotulo) votoEspelho = Math.max(-10, Math.min(10, votoEspelho + (curva === doRotulo ? 1 : -1)));
      h.lado = curva;
    } else if (doRotulo) h.lado = votoEspelho <= -4 ? -doRotulo : doRotulo;
    return h.lado || 1;
  }

  function atualizar(r, p, h) {
    nP.crossVectors(a1.subVectors(p[5], p[0]), a2.subVectors(p[17], p[0])).normalize();
    atualizarMao(r, p, ladoDaPalma(h, p, nP));
  }

  // ---- poses sintéticas para ?maoteste (pontos 3D em metros, nos eixos do worldLandmarks: x direita, y baixo, z longe da câmera) ----
  // Mão direita de verdade, palma para a câmera, dedos para cima, polegar à direita da imagem; espelhar = mão esquerda.
  function poseTeste(nome, espelhar) {
    const fecha = [1.45, 1.6, 0.75], ab = [0.08, 0.1, 0.05];
    const ANG = { aberta: [ab, [0.05, 0.08, 0.04], ab, [0.12, 0.12, 0.06]], punho: [fecha, fecha, fecha, fecha],
      um: [[0.05, 0.06, 0.03], fecha, fecha, fecha], ok: [[0.62, 0.8, 0.5], [0.15, 0.2, 0.1], [0.2, 0.25, 0.12], [0.25, 0.28, 0.14]] }[nome]
      || [ab, ab, ab, ab];
    const BASE = [[0.022, 0.035], [0.002, 0.040], [-0.017, 0.036], [-0.033, 0.026]];
    const COMP = [[0.040, 0.024, 0.020], [0.045, 0.027, 0.021], [0.042, 0.026, 0.020], [0.032, 0.019, 0.018]];
    const ABRE = [0.1, 0, -0.08, -0.18];
    const c = Array.from({ length: 21 }, () => [0, 0, 0]);   // [lado do polegar, para cima, para a palma]
    c[0] = [0, -0.045, 0.004];
    for (let f = 0; f < 4; f++) {
      const m = 5 + 4 * f; let x = BASE[f][0], u = BASE[f][1], z = 0, th = 0;
      c[m] = [x, u, z];
      for (let j = 0; j < 3; j++) {
        th += ANG[f][j];
        x += Math.sin(ABRE[f]) * Math.cos(th) * COMP[f][j]; u += Math.cos(ABRE[f]) * Math.cos(th) * COMP[f][j]; z += Math.sin(th) * COMP[f][j];
        c[m + 1 + j] = [x, u, z];
      }
    }
    const soma = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    c[1] = [0.019, -0.03, 0.006]; c[2] = [0.038, -0.01, 0.014];
    if (nome === "ok") { c[4] = soma(c[8], [0.005, -0.004, 0.003]); c[3] = soma(c[2].map((v, i) => (v + c[4][i]) / 2), [0.013, -0.005, 0.001]); }
    else if (nome === "punho" || nome === "um") { c[3] = soma(c[2], [-0.004, 0.018, 0.026]); c[4] = soma(c[3], [-0.022, 0.006, 0.006]); }
    else { c[3] = soma(c[2], [0.019, 0.022, 0.009]); c[4] = soma(c[3], [0.012, 0.022, 0.006]); }
    const giro = Number(new URLSearchParams(location.search).get("giro")) || 0;   // ?giro=3 vira a mão para ver o dorso
    const ry = (espelhar ? -0.45 : 0.45) + giro, rx = -0.25, cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    const w = c.map(([X, U, Pz]) => {
      const x = espelhar ? -X : X, y = -U, z = -Pz;
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      return { x: x1, y: y * cx - z1 * sx, z: y * sx + z1 * cx };
    });
    const m = w.reduce((s, q) => ({ x: s.x + q.x / 21, y: s.y + q.y / 21, z: s.z + q.z / 21 }), { x: 0, y: 0, z: 0 });
    return w.map(q => ({ x: q.x - m.x, y: q.y - m.y, z: q.z - m.z }));
  }
  function projetar(world, T, W, H, hfov) {   // pontos 2D normalizados de uma câmera pinhole, como o MediaPipe daria
    const f = (W / 2) / Math.tan(hfov * Math.PI / 360);
    return world.map(w => ({ x: (f * (w.x + T.x) / (w.z + T.z) + W / 2) / W, y: (f * (w.y + T.y) / (w.z + T.z) + H / 2) / H, z: 0 }));
  }

  // ---- rótulo discreto com o visual atual ----
  const rotulo = document.createElement("div");
  rotulo.style.cssText = "position:fixed;left:12px;bottom:10px;z-index:60;font:500 11px system-ui,sans-serif;letter-spacing:.03em;"
    + "color:#cfd8e3;pointer-events:none;transition:opacity .5s;opacity:" + (ROTULO_FIXO ? .5 : 0);
  document.body.appendChild(rotulo);
  let some = 0;
  function mostrarRotulo() {
    rotulo.textContent = "mão: " + visual + " · V alterna";
    if (ROTULO_FIXO) return;
    rotulo.style.opacity = .75; clearTimeout(some); some = setTimeout(() => { rotulo.style.opacity = 0; }, 2200);
  }
  rotulo.textContent = "mão: " + visual + " · V alterna";
  function alternar() {
    visual = visual === "realista" ? "antigo" : "realista";
    try { localStorage.setItem("maoVisual", visual); } catch (e) {}
    for (const r of todas) r.grupo.visible = visual === "realista";
    mostrarRotulo();
  }
  return { criar, atualizar, alternar, visual: () => visual, poseTeste, projetar };
})(-1, !TRES && !EMBUTIDO && !MINI);

function makeHand(color) {
  const skin = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.48, metalness: 0, sheen: 0.6, sheenColor: new THREE.Color(0xffd9c4),
    sheenRoughness: 0.5, clearcoat: 0.08, clearcoatRoughness: 0.6, side: THREE.DoubleSide,
  });
  const group = new THREE.Group(), velha = new THREE.Group(); group.add(velha);
  const add = m => { m.castShadow = true; velha.add(m); return m; };

  const joints = R.map((r, i) => { const m = add(new THREE.Mesh(sphereGeo, skin)); m.scale.setScalar(i === 0 ? PALM_HALF : r); return m; });
  // segmentos afunilados: cilindro com raio da junta de origem e da junta de destino
  const bones = [
    ...FINGER_BONES.map(([a, b]) => ({ a, b, ra: R[a], rb: R[b] })),
    ...PALM_EDGE.map(([a, b]) => ({ a, b, ra: PALM_HALF, rb: PALM_HALF })),
  ].map(s => {
    const m = add(new THREE.Mesh(new THREE.CylinderGeometry(s.rb, s.ra, 1, 24, 1, true), skin));
    m.userData = s; return m;
  });
  // juntas do contorno da palma com o raio da espessura da palma (bordas arredondadas)
  for (const i of [1, 2, 5, 9, 13, 17]) joints[i].scale.setScalar(Math.max(R[i], PALM_HALF));

  // palma com volume: face superior + inferior + laterais
  const n = OUTLINE.length;
  const palmGeo = new THREE.BufferGeometry();
  palmGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array((2 * n + 2) * 3), 3));
  const idx = [];
  const T0 = 0, B0 = n, TC = 2 * n, BC = 2 * n + 1;
  for (let k = 0; k < n; k++) {
    const k2 = (k + 1) % n;
    idx.push(TC, T0 + k, T0 + k2);                 // topo
    idx.push(BC, B0 + k2, B0 + k);                 // base
    idx.push(T0 + k, B0 + k, B0 + k2, T0 + k, B0 + k2, T0 + k2); // lateral
  }
  palmGeo.setIndex(idx);
  const palm = add(new THREE.Mesh(palmGeo, skin));

  const pts = Array.from({ length: 21 }, () => new THREE.Vector3());
  group.visible = false;
  scene.add(group);
  return { group, velha, real: MaoReal.criar(color, group), lado: 1, rotulo: null, joints, bones, palm, pts, T: new THREE.Vector3(), fresh: true };
}
const hands = [makeHand(0xe2a07c), makeHand(0xd8956f)];
// Visual da mão: realista (padrão) ou o antigo, de esferas e cilindros (tecla V)
function desenharMao(h) {
  const real = MaoReal.visual() === "realista";
  h.velha.visible = !real; h.real.grupo.visible = real;
  if (real) MaoReal.atualizar(h.real, h.pts, h); else desenharAntiga(h);
  h.group.visible = true;
}
function alternarVisual() { MaoReal.alternar(); hands.forEach(h => { if (!h.fresh) desenharMao(h); }); }
// ?maoteste=1: poses sintéticas fixas (aberta, punho, um dedo, OK), montadas em 3D no código e passadas por updateHand,
// sem câmera. Com =1 elas se alternam a cada 2,5 s; ?maoteste=punho (ou aberta, um, ok) fixa uma.
const MAOTESTE = new URLSearchParams(location.search).get("maoteste");
function aplicarTeste() {
  const poses = ["aberta", "punho", "um", "ok"];
  const nome = poses.includes(MAOTESTE) ? MAOTESTE : poses[Math.floor(performance.now() / 2500) % poses.length];
  [[0, false, -0.075], [1, true, 0.075]].forEach(([k, espelhar, tx]) => {
    const w = MaoReal.poseTeste(nome, espelhar);
    hands[k].rotulo = espelhar ? "Right" : "Left";
    const z = Number(new URLSearchParams(location.search).get("dist")) || 0.42;   // ?dist=0.25 aproxima
    updateHand(hands[k], w, MaoReal.projetar(w, { x: tx * z / 0.42, y: 0, z }, 1280, 720, HFOV), 1280, 720);
  });
  return nome;
}

// ---------- posição real no espaço ----------
// Acha a translação T (câmera -> mão) que faz os pontos 3D métricos da mão,
// projetados por uma câmera pinhole com o FOV estimado, caírem sobre os pontos 2D detectados.
// Mínimos quadrados lineares em (Tx, Ty, Tz).
function solveTranslation(world, img, W, H) {
  const f = (W / 2) / Math.tan(THREE.MathUtils.degToRad(HFOV) / 2);
  const cx = W / 2, cy = H / 2;
  const A = [0,0,0, 0,0,0, 0,0,0], b = [0,0,0];
  const addRow = (r, y) => {
    for (let i = 0; i < 3; i++) { b[i] += r[i] * y; for (let j = 0; j < 3; j++) A[i*3+j] += r[i] * r[j]; }
  };
  for (let i = 0; i < 21; i++) {
    const P = world[i], u = img[i].x * W - cx, v = img[i].y * H - cy;
    addRow([f, 0, -u], u * P.z - f * P.x);
    addRow([0, f, -v], v * P.z - f * P.y);
  }
  const det3 = m => m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]);
  const D = det3(A);
  if (Math.abs(D) < 1e-9) return null;
  const col = (c) => { const m = A.slice(); for (let r = 0; r < 3; r++) m[r*3+c] = b[r]; return det3(m) / D; };
  return new THREE.Vector3(col(0), col(1), col(2));
}

const tmp = new THREE.Vector3(), dir = new THREE.Vector3(), cen = new THREE.Vector3(), nrm = new THREE.Vector3();
function updateHand(h, world, img, W, H) {
  const T = solveTranslation(world, img, W, H);
  if (!T || T.z < 0.08 || T.z > 3) return;
  if (h.fresh) h.T.copy(T); else h.T.lerp(T, 0.35);          // profundidade oscila mais: suaviza mais
  for (let i = 0; i < 21; i++) {
    const w = world[i];
    // câmera (x dir., y baixo, z frente) -> three (y cima, z para trás); x espelhado (modo selfie)
    tmp.set(-(w.x + h.T.x), -(w.y + h.T.y), -(w.z + h.T.z));
    if (h.fresh) h.pts[i].copy(tmp); else h.pts[i].lerp(tmp, 0.55);
  }
  h.fresh = false;

  desenharMao(h);
}

// desenho antigo: esferas nas juntas, cilindros nos ossos e a palma como uma placa
function desenharAntiga(h) {
  h.joints.forEach((m, i) => m.position.copy(h.pts[i]));
  for (const m of h.bones) {
    const { a, b } = m.userData;
    dir.subVectors(h.pts[b], h.pts[a]);
    const len = dir.length();
    m.position.addVectors(h.pts[a], h.pts[b]).multiplyScalar(0.5);
    m.scale.set(1, len, 1);
    m.quaternion.setFromUnitVectors(UP, dir.normalize());
  }

  // palma: contorno deslocado ±espessura ao longo da normal da palma
  const p = h.pts;
  cen.set(0, 0, 0); OUTLINE.forEach(i => cen.add(p[i])); cen.divideScalar(OUTLINE.length);
  nrm.crossVectors(tmp.subVectors(p[5], p[0]), dir.subVectors(p[17], p[0])).normalize();
  const pos = h.palm.geometry.attributes.position, n = OUTLINE.length;
  OUTLINE.forEach((i, k) => {
    // puxa levemente para o centro para não vazar além das juntas arredondadas
    tmp.copy(p[i]).lerp(cen, 0.08);
    pos.setXYZ(k,     tmp.x + nrm.x * PALM_HALF, tmp.y + nrm.y * PALM_HALF, tmp.z + nrm.z * PALM_HALF);
    pos.setXYZ(n + k, tmp.x - nrm.x * PALM_HALF, tmp.y - nrm.y * PALM_HALF, tmp.z - nrm.z * PALM_HALF);
  });
  pos.setXYZ(2 * n,     cen.x + nrm.x * PALM_HALF * 1.15, cen.y + nrm.y * PALM_HALF * 1.15, cen.z + nrm.z * PALM_HALF * 1.15);
  pos.setXYZ(2 * n + 1, cen.x - nrm.x * PALM_HALF * 1.15, cen.y - nrm.y * PALM_HALF * 1.15, cen.z - nrm.z * PALM_HALF * 1.15);
  pos.needsUpdate = true;
  h.palm.geometry.computeVertexNormals();
  h.palm.geometry.computeBoundingSphere();
}

// Miniatura: a câmera virtual continua no lugar da webcam, mira no centro das mãos e fecha o campo de visão (zoom).
const centroMini = new THREE.Vector3();
function enquadrarMini() {
  const vis = hands.filter(h => h.group.visible);
  if (!vis.length) return;
  centroMini.set(0, 0, 0);
  for (const h of vis) for (const p of h.pts) centroMini.add(p);
  centroMini.divideScalar(vis.length * 21);
  let raio = 0;
  for (const h of vis) for (const p of h.pts) raio = Math.max(raio, p.distanceTo(centroMini));
  const a = Math.asin(Math.min((raio + 0.03) / Math.max(centroMini.length(), 0.05), 0.9));
  const vertical = camera.aspect >= 1 ? a : Math.atan(Math.tan(a) / camera.aspect);
  fovMini += (THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(2 * vertical) * 1.1, 8, 75) - fovMini) * 0.1;
  controls.target.lerp(centroMini, 0.18);
  camera.fov = fovMini;
  camera.updateProjectionMatrix();
}

// ---------- MediaPipe ----------
let landmarker;
async function createLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = delegate => ({
    baseOptions: { modelAssetPath: "../modelos_externos/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { return await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { console.warn("GPU indisponível, usando CPU", e); return await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
}

function drawOverlay(res) {
  [overlay.width, overlay.height] = tamanhoFonte();
  octx.clearRect(0, 0, overlay.width, overlay.height);
  res.landmarks.forEach(lm => {
    octx.strokeStyle = "#7fd1ff"; octx.lineWidth = 3;
    for (const [a, b] of ALL_BONES) {
      octx.beginPath();
      octx.moveTo(lm[a].x * overlay.width, lm[a].y * overlay.height);
      octx.lineTo(lm[b].x * overlay.width, lm[b].y * overlay.height);
      octx.stroke();
    }
  });
}

// ---------- de onde vêm as imagens ----------
// Sozinha: a página abre a webcam. Na apresentação (?embutido=1) ou com ?servidor=1, a webcam é do servidor do projeto
// (demo/player.py, que a usa para os gestos) e a página lê o quadro sem espelhar que ele publica em /video_cru.
// Assim os gestos continuam funcionando enquanto a mão 3D aparece.
let lastVideoTime = -1, fps = 0, lastT = performance.now(), ultimaAnalise = 0;
function proximaImagem() {
  if (DO_SERVIDOR) {
    // o <img> do fluxo MJPEG sempre mostra o quadro mais recente; analisa a cada ~40 ms
    const [W, H] = tamanhoFonte();
    if (!W || performance.now() - ultimaAnalise < 40) return null;
    ultimaAnalise = performance.now();
    if (quadroCanvas.width !== W) { quadroCanvas.width = W; quadroCanvas.height = H; updateCameraFov(); }
    try { qctx.drawImage(stream, 0, 0); } catch (e) { return null; }
    return quadroCanvas;
  }
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return null;
  lastVideoTime = video.currentTime;
  return video;
}
// Telas 1 e 2 do modo três: o quadro espelhado (como um espelho, igual à mão 3D) e, na 2, o esqueleto do MediaPipe.
function desenharTres(fonte, res, W, H) {
  for (const c of [c1, c2]) {
    if (c.width !== W) { c.width = W; c.height = H; }
    const g = c.getContext("2d");
    g.setTransform(-1, 0, 0, 1, W, 0);
    g.drawImage(fonte, 0, 0, W, H);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  const g = c2.getContext("2d");
  const px = p => [(1 - p.x) * W, p.y * H];
  res.landmarks.forEach(lm => {
    g.strokeStyle = "#5aa2ff"; g.lineWidth = Math.max(3, W / 260);
    for (const [a, b] of ALL_BONES) { g.beginPath(); g.moveTo(...px(lm[a])); g.lineTo(...px(lm[b])); g.stroke(); }
    g.fillStyle = "#ffffff";
    lm.forEach(p => { const [x, y] = px(p); g.beginPath(); g.arc(x, y, Math.max(3.5, W / 200), 0, Math.PI * 2); g.fill(); });
  });
}
function loop() {
  requestAnimationFrame(loop);
  const imagem = landmarker ? proximaImagem() : null;
  if (imagem) {
    const [W, H] = tamanhoFonte();
    const res = landmarker.detectForVideo(imagem, performance.now());
    // ordena da esquerda para a direita (na visão espelhada) para cada cor ficar na mesma mão
    const order = res.landmarks.map((_, i) => i).sort((a, b) => res.landmarks[b][0].x - res.landmarks[a][0].x);
    hands.forEach((h, slot) => {
      const i = order[slot];
      if (i === undefined) { h.group.visible = false; h.fresh = true; return; }
      h.rotulo = res.handedness[i]?.[0]?.categoryName || null;   // Left/Right: diz de que lado fica a palma
    updateHand(h, res.worldLandmarks[i], res.landmarks[i], W, H);
    });
    drawOverlay(res);
    if (TRES) desenharTres(imagem, res, W, H);
    const now = performance.now();
    fps = 0.9 * fps + 0.1 * (1000 / (now - lastT)); lastT = now;
    const labels = order.map(i => (res.handedness[i][0].categoryName === "Left" ? "direita" : "esquerda"));
    statusEl.textContent = `${fps.toFixed(0)} FPS · mãos: ${res.landmarks.length}${labels.length ? " (" + labels.join(", ") + ")" : ""}`;
    depthEl.textContent = hands.filter(h => h.group.visible).map(h => `${(h.T.z * 100).toFixed(0)} cm`).join(" · ")
      .replace(/^(.+)$/, "distância da câmera: $1");
  }
  if (MAOTESTE) statusEl.textContent = "Teste: " + aplicarTeste();
  if (MINI) enquadrarMini();
  controls.update();
  renderer.render(scene, camera);
}
loop();

const startBtn = document.getElementById("start");
if (EMBUTIDO) addEventListener("keydown", ev => {
  // na apresentação, PageDown/PageUp trocam o slide mesmo com o foco aqui dentro
  if (ev.key === "PageDown" || ev.key === "PageUp") parent.postMessage({ navegar: ev.key === "PageDown" ? 1 : -1 }, location.origin);
});
startBtn.addEventListener("click", async () => {
  startBtn.style.display = "none";
  try {
    statusEl.textContent = "Carregando modelo…";
    landmarker ??= await createLandmarker();
    if (DO_SERVIDOR) {
      video.style.display = "none"; stream.style.display = "block";
      stream.src = "/video_cru";
      statusEl.textContent = "Mostre a mão para a câmera.";
      return;
    }
    statusEl.textContent = "Abrindo câmera…";
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    await video.play();
    updateCameraFov();
    statusEl.textContent = "Mostre a mão para a câmera.";
  } catch (err) {
    console.error(err);
    statusEl.textContent = err.name === "NotReadableError"
      ? "Erro: a câmera está em uso por outro programa. Feche-o e tente de novo."
      : "Erro: " + err.message;
    startBtn.textContent = "Tentar de novo";
    startBtn.style.display = "";
  }
});
addEventListener("pagehide", () => { stream.removeAttribute("src"); if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop()); });
if (DO_SERVIDOR && !MAOTESTE) startBtn.click();  // a imagem vem do servidor: liga sozinha
if (MAOTESTE) startBtn.style.display = "none";
</script>
